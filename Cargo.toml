[package]
name = "cladding"
version = "0.4.7"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
anyhow = "1.0.102"
cladding-fake-credentials = { path = "crates/fake-credentials" }
cladding-bridge = { path = "crates/cladding-bridge" }
clap = { version = "4.5.33", features = ["derive"] }
include_dir = "0.7.4"
jj-version = "0.1.1"
libc = "0.2.170"
rcgen = "0.14.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_json = "1.0.149"
signal-hook = "0.3.17"
thiserror = "2.0.18"
time = "0.3.55"
tokio = { version = "1.49.0", features = ["macros", "process", "io-util", "rt", "time"] }
toml = "1.1.6"
x509-parser = { version = "0.18.1", features = ["verify"] }

[build-dependencies]
serde_json = "1.0.149"

[workspace]
members = ["crates/cladding-bridge", "crates/fake-credentials"]
default-members = [".", "crates/cladding-bridge", "crates/fake-credentials"]
resolver = "2"
