apiVersion: v1
kind: Pod
metadata:
  name: REPLACE_AGENT_NAME
  labels:
    app: agent
    cladding: CLADDING_NAME
    project_root: "PROJECT_ROOT"
  annotations:
    io.podman.annotations.userns: "keep-id"
spec:
  hostAliases:
  - ip: "REPLACE_PROXY_IP"
    hostnames:
    - REPLACE_PROXY_NAME
  - ip: "REPLACE_SANDBOX_IP"
    hostnames:
    - REPLACE_SANDBOX_NAME
  - ip: "REPLACE_FS_SANDBOX_IP"
    hostnames:
    - REPLACE_FS_SANDBOX_NAME
  initContainers:
  - name: agent-node
    image: alpine:latest
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        add: ["NET_ADMIN"]
    volumeMounts:
    - name: scripts-dir
      mountPath: /opt/scripts
      readOnly: true
    - name: config-dir
      mountPath: /opt/config
      readOnly: true
    env:
    - name: CLADDING_PROXY_NAME
      value: "REPLACE_PROXY_NAME"
    - name: CLADDING_SANDBOX_NAME
      value: "REPLACE_SANDBOX_NAME"
    - name: CLADDING_AGENT_NAME
      value: "REPLACE_AGENT_NAME"
    - name: RUN_NW_SANDBOX_SERVER
      value: "REPLACE_RUN_NW_SANDBOX_SERVER"
    - name: RUN_FS_SANDBOX_SERVER
      value: "REPLACE_RUN_FS_SANDBOX_SERVER"
    command: ["/bin/sh", "/opt/scripts/jail_agent.sh"]
  containers:
  - name: agent
    image: REPLACE_AGENT_IMAGE
    imagePullPolicy: Never
    command: ["sleep", "infinity"]
    workingDir: /home/user/workspace
    stdin: true
    tty: true
    volumeMounts:
    - name: config-dir
      mountPath: /opt/config
      readOnly: true
    - name: tools-dir
      mountPath: /opt/tools
      readOnly: true
    - name: home-dir
      mountPath: /home/user
    - name: workspace-dir
      mountPath: /home/user/workspace
    - name: masked-cladding-dir
      mountPath: /home/user/workspace/.cladding
      readOnly: true
    env:
    - name: PATH
      value: "/opt/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: CLADDING_PROXY_NAME
      value: "REPLACE_PROXY_NAME"
    - name: CLADDING_SANDBOX_NAME
      value: "REPLACE_SANDBOX_NAME"
    - name: CLADDING_AGENT_NAME
      value: "REPLACE_AGENT_NAME"
    - name: http_proxy
      value: "http://REPLACE_PROXY_NAME:8080"
    - name: https_proxy
      value: "http://REPLACE_PROXY_NAME:8080"
    - name: HTTP_PROXY
      value: "http://REPLACE_PROXY_NAME:8080"
    - name: HTTPS_PROXY
      value: "http://REPLACE_PROXY_NAME:8080"
    - name: no_proxy
      value: "REPLACE_NO_PROXY"
    - name: NO_PROXY
      value: "REPLACE_NO_PROXY"
    - name: RUN_NW_SANDBOX_SERVER
      value: "REPLACE_RUN_NW_SANDBOX_SERVER"
    - name: RUN_FS_SANDBOX_SERVER
      value: "REPLACE_RUN_FS_SANDBOX_SERVER"
  volumes:
  - name: scripts-dir
    hostPath:
      path: PROJECT_ROOT/scripts
      type: Directory
  - name: config-dir
    hostPath:
      path: PROJECT_ROOT/config
      type: Directory
  - name: home-dir
    hostPath:
      path: PROJECT_ROOT/home
      type: Directory
  - name: workspace-dir
    hostPath:
      path: PROJECT_ROOT/..
      type: Directory
  - name: masked-cladding-dir
    configMap:
      name: empty-mask
  - name: tools-dir
    hostPath:
      path: PROJECT_ROOT/tools
      type: Directory
