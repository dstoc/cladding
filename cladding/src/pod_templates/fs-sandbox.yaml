apiVersion: v1
kind: Pod
metadata:
  name: REPLACE_FS_SANDBOX_NAME
  labels:
    app: fs-sandbox
    cladding: CLADDING_NAME
    project_root: "PROJECT_ROOT"
  annotations:
    io.podman.annotations.userns: "keep-id"
spec:
  initContainers:
  - name: fs-sandbox-node
    image: alpine:latest
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        add: ["NET_ADMIN"]
    volumeMounts:
    - name: scripts-dir
      mountPath: /opt/scripts
      readOnly: true
    command: ["/bin/sh", "/opt/scripts/jail_fs_sandbox.sh"]
  containers:
  - name: instance
    image: REPLACE_FS_SANDBOX_IMAGE
    imagePullPolicy: Never
    command: ["mcp-run"]
    ports:
    - containerPort: 3000
    workingDir: /home/user/workspace
    volumeMounts:
    - name: config-dir
      mountPath: /opt/config
      readOnly: true
    - name: tools-dir
      mountPath: /opt/tools
      readOnly: true
    - name: home-dir
      mountPath: /home/user
    - name: workspace-dir
      mountPath: /home/user/workspace
    - name: masked-cladding-dir
      mountPath: /home/user/workspace/.cladding
      readOnly: true
    env:
    - name: PATH
      value: "/opt/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: MCP_BIND_ADDR
      value: "0.0.0.0:3000"
    - name: POLICY_DIR
      value: "/opt/config/fs_sandbox"
  volumes:
  - name: scripts-dir
    hostPath:
      path: PROJECT_ROOT/scripts
      type: Directory
  - name: config-dir
    hostPath:
      path: PROJECT_ROOT/config
      type: Directory
  - name: tools-dir
    hostPath:
      path: PROJECT_ROOT/tools
      type: Directory
  - name: home-dir
    hostPath:
      path: PROJECT_ROOT/home
      type: Directory
  - name: workspace-dir
    hostPath:
      path: PROJECT_ROOT/..
      type: Directory
  - name: masked-cladding-dir
    configMap:
      name: empty-mask
