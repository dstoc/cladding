name: Podman Machine Linux feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-repeatability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Podman Machine and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            podman \
            qemu-system-x86 \
            qemu-utils \
            gvproxy \
            virtiofsd \
            uidmap \
            slirp4netns \
            fuse-overlayfs
          podman --version
          qemu-system-x86_64 --version
      - name: Configure Podman Machine helpers and KVM
        run: |
          set -euo pipefail
          helper_dir=/usr/local/libexec/podman
          sudo install -d "$helper_dir"
          sudo ln -sf /usr/bin/gvproxy "$helper_dir/gvproxy"
          sudo ln -sf /usr/libexec/virtiofsd "$helper_dir/virtiofsd"
          test -x "$helper_dir/gvproxy"
          test -x "$helper_dir/virtiofsd"
          echo "gvproxy: $(readlink -f "$helper_dir/gvproxy")"
          echo "virtiofsd: $(readlink -f "$helper_dir/virtiofsd")"
          ls -l "$helper_dir"

          sudo chmod 666 /dev/kvm
          stat --format='KVM permissions: %a %n' /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Repeat Podman Machine startup and remote-engine checks
        shell: bash
        run: |
          set -euo pipefail
          machine_name=podman-machine-default
          cleanup() {
            podman machine stop "$machine_name" >/dev/null 2>&1 || true
            podman machine rm --force "$machine_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          podman machine init --cpus 2 --memory 4096 --rootful=false "$machine_name"
          for attempt in 1 2 3; do
            echo "Podman Machine startup cycle $attempt"
            podman machine start "$machine_name"
            rootless=$(podman --connection "$machine_name" info --format '{{.Host.Security.Rootless}}')
            test "$rootless" = true
            podman machine ssh "$machine_name" id -u
            podman machine stop "$machine_name"
          done
