name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "chore: release X.Y.Z" PR from conventional commits. Merging
  # that PR bumps the version, tags it, and creates a draft GitHub Release.
  # The release is published only after binaries have been attached, which is
  # required when GitHub immutable releases are enabled.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cladding embeds Linux execution helpers in its container tools directory.
  # Build helper artifacts for each Linux guest architecture and reuse them on
  # host builds, including Apple Silicon macOS.
  build-helpers:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux helpers
        run: cargo build -p mcp-run -p cladding-bridge --release --locked --target "${{ matrix.target }}" --bin mcp-run --bin run-remote --bin cladding-bridge
      - name: Stage helpers
        run: |
          mkdir -p helpers
          cp "target/${{ matrix.target }}/release/mcp-run" helpers/
          cp "target/${{ matrix.target }}/release/run-remote" helpers/
          cp "target/${{ matrix.target }}/release/cladding-bridge" helpers/
          for tool in helpers/*; do
            chmod 0755 "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "${{ matrix.arch }}:$description" in
              x86_64:"ELF 64-bit"*x86-64*) ;;
              aarch64:"ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux ${{ matrix.arch }} executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-linux-helpers-${{ matrix.arch }}
          path: helpers/

  # Only runs on the push that merges the release PR (release_created == true).
  # Builds a release binary per target and attaches it to the draft Release.
  upload-binaries:
    needs: [release-please, build-helpers]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            baffle_arch: x86_64
            helper_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baffle_arch: aarch64
            helper_arch: aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            baffle_arch: aarch64
            helper_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned Baffle v2.2.0 release
        run: |
          set -euo pipefail
          scripts/fetch_baffle.sh "${{ matrix.baffle_arch }}" "$RUNNER_TEMP/baffle"
          test -s "$RUNNER_TEMP/baffle/LICENSE"
          test -s "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/THIRD-PARTY-NOTICES.txt"
          test -s "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/webpki-root-certs-CDLA-Permissive-2.0.txt"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "${{ matrix.baffle_arch }}:$description" in
            x86_64:"ELF 64-bit"*x86-64*) ;;
            aarch64:"ELF 64-bit"*aarch64*) ;;
            *) echo "Baffle is not the expected Linux ${{ matrix.baffle_arch }} executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          test "$("$RUNNER_TEMP/baffle/baffle" --version)" = "baffle 2.2.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch prebuilt helpers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-${{ matrix.helper_arch }}
          path: helpers
      - name: Point build.rs at prebuilt helpers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          echo "CLADDING_MCP_RUN_BIN=$GITHUB_WORKSPACE/helpers/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$GITHUB_WORKSPACE/helpers/run-remote" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$GITHUB_WORKSPACE/helpers/cladding-bridge" >> "$GITHUB_ENV"
      - name: Point build.rs at the validated Linux Baffle binary
        run: echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      # --locked is safe: the cargo-workspace plugin keeps the root Cargo.lock
      # in sync with the version bump on the release commit.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cladding
      - name: Package
        shell: bash
        run: |
          bin=cladding
          staging="${bin}-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}"
          mkdir "$staging"
          mkdir -p "$staging/crates/mcp-run" \
            "$staging/docs/features/baffle-integration" \
            "$staging/docs/features/proxy" \
            "$staging/docs/user-guide"
          cp "target/${{ matrix.target }}/release/${bin}" "$staging/"
          cp README.md "$staging/"
          cp crates/mcp-run/README.md "$staging/crates/mcp-run/"
          cp docs/features/current-runtime-summary.md "$staging/docs/features/"
          cp docs/features/baffle-integration/embedded-baffle.md "$staging/docs/features/baffle-integration/"
          cp docs/features/proxy/summary.md "$staging/docs/features/proxy/"
          cp docs/user-guide/*.md "$staging/docs/user-guide/"
          mkdir -p "$staging/licenses/baffle"
          cp "$RUNNER_TEMP/baffle/LICENSE" "$staging/licenses/baffle/LICENSE"
          cp "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/THIRD-PARTY-NOTICES.txt" "$staging/licenses/baffle/"
          cp "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/webpki-root-certs-CDLA-Permissive-2.0.txt" "$staging/licenses/baffle/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET" --clobber

  publish-release:
    needs: [release-please, upload-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
