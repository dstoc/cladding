name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "chore: release X.Y.Z" PR from conventional commits. Merging
  # that PR bumps the version, tags it, and creates a draft GitHub Release.
  # The release is published only after binaries have been attached, which is
  # required when GitHub immutable releases are enabled.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cladding embeds Linux mcp-run/run-remote helpers for its sandbox containers
  # and a Linux Baffle executable for the proxy container. GitHub's macOS
  # runners can't run a Linux container to build these artifacts, so build
  # Baffle on native Linux runners and cross-compile the arm64 helpers here.
  build-helpers:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build helpers (aarch64 Linux)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          cargo build -p mcp-run --release --locked \
            --target aarch64-unknown-linux-gnu \
            --bin mcp-run --bin run-remote
      - name: Stage helpers
        run: |
          mkdir helpers
          cp target/aarch64-unknown-linux-gnu/release/mcp-run helpers/
          cp target/aarch64-unknown-linux-gnu/release/run-remote helpers/
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-run-helpers-aarch64-linux
          path: helpers/

  # Build the pinned Baffle crate once for each supported Linux guest
  # architecture. Reuse these validated binaries in the host release jobs.
  build-baffle:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Install Baffle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libclang-dev
      - name: Install pinned Baffle
        run: cargo install --locked --force --version '=0.2.0' --root "$RUNNER_TEMP/baffle-install" --bin baffle baffle-proxy
      - name: Collect Baffle license notices
        run: |
          manifest=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path '*/baffle-proxy-0.2.0/Cargo.toml' -print -quit)
          test -n "$manifest"
          cargo fetch --locked --manifest-path "$manifest"
          mkdir -p baffle
          cp "$RUNNER_TEMP/baffle-install/bin/baffle" baffle/baffle
          python3 scripts/collect-baffle-notices.py "$manifest" baffle
      - name: Run Baffle in the proxy image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/baffle/baffle:/usr/local/bin/baffle:ro" \
            --entrypoint /usr/local/bin/baffle \
            docker.io/ubuntu/squid:latest --help
      - uses: actions/upload-artifact@v4
        with:
          name: baffle-linux-${{ matrix.arch }}
          path: baffle/

  # Only runs on the push that merges the release PR (release_created == true).
  # Builds a release binary per target and attaches it to the draft Release.
  upload-binaries:
    needs: [release-please, build-helpers, build-baffle]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            baffle_arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            baffle_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: baffle-linux-${{ matrix.baffle_arch }}
          path: baffle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # macOS can't run a Linux container to build the embedded helpers, so pull
      # the prebuilt aarch64-linux binaries and let build.rs copy them in via the
      # CLADDING_MCP_RUN_BIN / CLADDING_RUN_REMOTE_BIN escape hatch. On Linux the
      # build.rs builds them locally, so this step is skipped.
      - name: Fetch prebuilt helpers
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: mcp-run-helpers-aarch64-linux
          path: helpers
      - name: Point build.rs at prebuilt helpers
        if: runner.os == 'macOS'
        run: |
          echo "CLADDING_MCP_RUN_BIN=$GITHUB_WORKSPACE/helpers/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$GITHUB_WORKSPACE/helpers/run-remote" >> "$GITHUB_ENV"
      - name: Point build.rs at the validated Linux Baffle binary
        run: echo "CLADDING_BAFFLE_BIN=$GITHUB_WORKSPACE/baffle/baffle" >> "$GITHUB_ENV"
      # --locked is safe: the cargo-workspace plugin keeps the root Cargo.lock
      # in sync with the version bump on the release commit.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cladding
      - name: Package
        shell: bash
        run: |
          bin=cladding
          staging="${bin}-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}"
          mkdir "$staging"
          mkdir -p "$staging/docs/features/baffle-integration"
          cp "target/${{ matrix.target }}/release/${bin}" "$staging/"
          cp README.md "$staging/"
          cp docs/features/baffle-integration/embedded-baffle.md "$staging/docs/features/baffle-integration/"
          cp baffle/THIRD_PARTY_NOTICES.md "$staging/"
          cp -R baffle/licenses "$staging/"
          if [ -f baffle/Cargo.lock ]; then cp baffle/Cargo.lock "$staging/baffle-Cargo.lock"; fi
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET" --clobber

  publish-release:
    needs: [release-please, upload-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
