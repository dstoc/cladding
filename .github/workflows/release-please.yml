name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "chore: release X.Y.Z" PR from conventional commits. Merging
  # that PR bumps the version, tags it, and creates a draft GitHub Release.
  # The release is published only after binaries have been attached, which is
  # required when GitHub immutable releases are enabled.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cladding embeds Linux execution helpers in its container tools directory.
  # Build helper artifacts for each Linux guest architecture and reuse them on
  # host builds, including Apple Silicon macOS.
  build-helpers:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Download and verify pinned Gantry v0.4.8 release
        run: |
          set -euo pipefail
          scripts/fetch_gantry.sh "${{ matrix.arch }}" "$RUNNER_TEMP/gantry"
          scripts/validate_gantry_release.sh "$RUNNER_TEMP/gantry"
      - name: Build and stage cladding-bridge
        run: |
          set -euo pipefail
          cargo build -p cladding-bridge --release --locked --target "${{ matrix.target }}" --bin cladding-bridge
          mkdir -p helpers/gantry
          cp -a "$RUNNER_TEMP/gantry/." helpers/gantry/
          cp "target/${{ matrix.target }}/release/cladding-bridge" helpers/cladding-bridge
          chmod 0755 helpers/cladding-bridge
          description=$(file -b helpers/cladding-bridge)
          printf '%s\n' "$description"
          case "${{ matrix.arch }}:$description" in
            x86_64:"ELF 64-bit"*x86-64*) ;;
            aarch64:"ELF 64-bit"*aarch64*) ;;
            *) echo "Expected a Linux ${{ matrix.arch }} cladding-bridge" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-linux-helpers-${{ matrix.arch }}
          path: helpers/

  # Only runs on the push that merges the release PR (release_created == true).
  # Builds a release binary per target and attaches it to the draft Release.
  upload-binaries:
    needs: [release-please, build-helpers]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            baffle_arch: x86_64
            helper_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baffle_arch: aarch64
            helper_arch: aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            baffle_arch: aarch64
            helper_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned Baffle v2.2.0 release
        run: |
          set -euo pipefail
          scripts/fetch_baffle.sh "${{ matrix.baffle_arch }}" "$RUNNER_TEMP/baffle"
          test -s "$RUNNER_TEMP/baffle/LICENSE"
          test -s "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/THIRD-PARTY-NOTICES.txt"
          test -s "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/webpki-root-certs-CDLA-Permissive-2.0.txt"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "${{ matrix.baffle_arch }}:$description" in
            x86_64:"ELF 64-bit"*x86-64*) ;;
            aarch64:"ELF 64-bit"*aarch64*) ;;
            *) echo "Baffle is not the expected Linux ${{ matrix.baffle_arch }} executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          test "$("$RUNNER_TEMP/baffle/baffle" --version)" = "baffle 2.2.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch prebuilt helpers
        uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-${{ matrix.helper_arch }}
          path: helpers
      - name: Restore and verify downloaded Gantry helper executables
        run: |
          set -euo pipefail
          test "$(cat helpers/gantry/VERSION)" = 0.4.8
          for name in gantry run-remote; do
            tool="helpers/gantry/$name"
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "${{ matrix.helper_arch }}:$description" in
              x86_64:"ELF 64-bit"*x86-64*) ;;
              aarch64:"ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux ${{ matrix.helper_arch }} Gantry executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Point build.rs at prebuilt helpers
        run: |
          echo "CLADDING_GANTRY_DIR=$GITHUB_WORKSPACE/helpers/gantry" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$GITHUB_WORKSPACE/helpers/cladding-bridge" >> "$GITHUB_ENV"
      - name: Point build.rs at the validated Linux Baffle binary
        run: echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      # --locked is safe: the cargo-workspace plugin keeps the root Cargo.lock
      # in sync with the version bump on the release commit.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cladding
      - name: Package
        shell: bash
        run: |
          bin=cladding
          staging="${bin}-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}"
          mkdir "$staging"
          mkdir -p "$staging/docs/gantry/docs" \
            "$staging/docs/features/baffle-integration" \
            "$staging/docs/features/proxy" \
            "$staging/docs/user-guide"
          cp "target/${{ matrix.target }}/release/${bin}" "$staging/"
          cp README.md "$staging/"
          cp helpers/gantry/README.md "$staging/docs/gantry/"
          cp helpers/gantry/docs/reference.md "$staging/docs/gantry/docs/reference.md"
          cp docs/features/current-runtime-summary.md "$staging/docs/features/"
          cp docs/features/baffle-integration/embedded-baffle.md "$staging/docs/features/baffle-integration/"
          cp docs/features/proxy/summary.md "$staging/docs/features/proxy/"
          cp docs/user-guide/*.md "$staging/docs/user-guide/"
          mkdir -p "$staging/licenses/baffle"
          cp "$RUNNER_TEMP/baffle/LICENSE" "$staging/licenses/baffle/LICENSE"
          cp "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/THIRD-PARTY-NOTICES.txt" "$staging/licenses/baffle/"
          cp "$RUNNER_TEMP/baffle/share/doc/baffle/licenses/webpki-root-certs-CDLA-Permissive-2.0.txt" "$staging/licenses/baffle/"
          mkdir -p "$staging/licenses/gantry"
          cp helpers/gantry/LICENSE "$staging/licenses/gantry/LICENSE"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET" --clobber

  # Repackages the helper binaries already built by build-helpers. Keep this
  # separate from upload-binaries so each existing host archive stays intact.
  package-bridge-assets:
    needs: [release-please, build-helpers]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      x86_64_executable_sha256: ${{ steps.package.outputs.x86_64_executable_sha256 }}
      aarch64_executable_sha256: ${{ steps.package.outputs.aarch64_executable_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-x86_64
          path: ${{ runner.temp }}/helpers/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-aarch64
          path: ${{ runner.temp }}/helpers/aarch64
      - name: Package and verify cladding-bridge release assets
        id: package
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/cladding-bridge-release"
          archive_sums="$assets_dir/cladding-bridge-SHA256SUMS"
          executable_sums="$assets_dir/cladding-bridge-executable-SHA256SUMS"
          mkdir -p "$assets_dir"
          : > "$archive_sums"
          : > "$executable_sums"

          for arch in x86_64 aarch64; do
            target="${arch}-unknown-linux-gnu"
            bridge="$RUNNER_TEMP/helpers/$arch/cladding-bridge"
            test -f "$bridge"
            chmod 0755 "$bridge"
            description=$(file -b "$bridge")
            printf '%s: %s\n' "$bridge" "$description"
            case "$arch:$description" in
              x86_64:"ELF 64-bit"*x86-64*) ;;
              aarch64:"ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux $arch cladding-bridge executable" >&2; exit 1 ;;
            esac

            archive="$assets_dir/cladding-bridge-${RELEASE_TAG}-${target}.tar.gz"
            (
              cd "$(dirname "$bridge")"
              tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - cladding-bridge | gzip -n > "$archive"
            )
            test "$(tar -tzf "$archive")" = cladding-bridge

            extracted="$RUNNER_TEMP/verify-cladding-bridge-$arch"
            mkdir -p "$extracted"
            tar -xzf "$archive" -C "$extracted"
            test -f "$extracted/cladding-bridge"
            cmp "$bridge" "$extracted/cladding-bridge"
            chmod 0755 "$extracted/cladding-bridge"
            test -x "$extracted/cladding-bridge"
            extracted_description=$(file -b "$extracted/cladding-bridge")
            printf '%s: %s\n' "$archive" "$extracted_description"
            case "$arch:$extracted_description" in
              x86_64:"ELF 64-bit"*x86-64*) ;;
              aarch64:"ELF 64-bit"*aarch64*) ;;
              *) echo "Archive does not contain a Linux $arch executable" >&2; exit 1 ;;
            esac

            archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
            executable_sha256=$(sha256sum "$extracted/cladding-bridge" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" >> "$archive_sums"
            printf '%s  cladding-bridge-%s-%s\n' "$executable_sha256" "$RELEASE_TAG" "$target" >> "$executable_sums"
            printf '%s_executable_sha256=%s\n' "$arch" "$executable_sha256" >> "$GITHUB_OUTPUT"
          done

          (cd "$assets_dir" && sha256sum --check cladding-bridge-SHA256SUMS)
          cat "$archive_sums"
          cat "$executable_sums"
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-bridge-executable-checksums-${{ needs.release-please.outputs.tag_name }}
          path: ${{ runner.temp }}/cladding-bridge-release/cladding-bridge-executable-SHA256SUMS
          if-no-files-found: error
      - name: Upload bridge assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/cladding-bridge-release/cladding-bridge-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "$RUNNER_TEMP/cladding-bridge-release/cladding-bridge-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            "$RUNNER_TEMP/cladding-bridge-release/cladding-bridge-SHA256SUMS" \
            --clobber

  publish-release:
    needs: [release-please, upload-binaries, package-bridge-assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
