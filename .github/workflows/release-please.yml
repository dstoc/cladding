name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "chore: release X.Y.Z" PR from conventional commits. Merging
  # that PR bumps the version, tags it, and creates a draft GitHub Release.
  # The release is published only after binaries have been attached, which is
  # required when GitHub immutable releases are enabled.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cladding embeds Linux mcp-run/run-remote helpers for its sandbox containers
  # and a Linux Baffle executable for the proxy container. Build native helper
  # artifacts for each Linux guest architecture and reuse them on host builds.
  build-helpers:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux helpers
        run: cargo build -p mcp-run --release --locked --target "${{ matrix.target }}" --bin mcp-run --bin run-remote
      - name: Stage helpers
        run: |
          mkdir -p helpers
          cp "target/${{ matrix.target }}/release/mcp-run" helpers/
          cp "target/${{ matrix.target }}/release/run-remote" helpers/
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-run-helpers-${{ matrix.arch }}-linux
          path: helpers/

  # Build the pinned Baffle crate once for each supported Linux guest
  # architecture. Reuse these validated binaries in the host release jobs.
  build-baffle:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BAFFLE_PROXY_VERSION: 0.2.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-baffle-release
          shared-key: ${{ matrix.arch }}-${{ env.BAFFLE_PROXY_VERSION }}
          cache-all-crates: true
      - name: Install Baffle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake file libclang-dev
      - name: Install pinned Baffle
        run: cargo install --locked --force --version "=$BAFFLE_PROXY_VERSION" --root "$RUNNER_TEMP/baffle-install" --bin baffle baffle-proxy
      - name: Verify the Baffle architecture
        run: |
          description=$(file -b "$RUNNER_TEMP/baffle-install/bin/baffle")
          printf '%s\n' "$description"
          case "${{ matrix.arch }}:$description" in
            x86_64:*"ELF 64-bit"*x86-64*) ;;
            aarch64:*"ELF 64-bit"*aarch64*) ;;
            *) echo "Baffle is not the expected Linux ${{ matrix.arch }} executable" >&2; exit 1 ;;
          esac
      - name: Collect Baffle license notices
        run: |
          manifest=$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path "*/baffle-proxy-$BAFFLE_PROXY_VERSION/Cargo.toml" -print -quit)
          test -n "$manifest"
          cargo fetch --locked --manifest-path "$manifest"
          mkdir -p baffle
          cp "$RUNNER_TEMP/baffle-install/bin/baffle" baffle/baffle
          python3 scripts/collect-baffle-notices.py "$manifest" baffle
      - name: Build the default proxy runtime image
        run: docker build --file Containerfile.proxy --tag cladding-baffle-proxy-check .
      - name: Start Baffle in the default proxy runtime image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/baffle/baffle:/opt/tools/bin/baffle:ro" \
            --entrypoint /opt/tools/bin/baffle \
            cladding-baffle-proxy-check --help
      - uses: actions/upload-artifact@v4
        with:
          name: baffle-linux-${{ matrix.arch }}
          path: baffle/

  # Only runs on the push that merges the release PR (release_created == true).
  # Builds a release binary per target and attaches it to the draft Release.
  upload-binaries:
    needs: [release-please, build-helpers, build-baffle]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            baffle_arch: x86_64
            helper_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baffle_arch: aarch64
            helper_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            baffle_arch: x86_64
            helper_arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            baffle_arch: aarch64
            helper_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: baffle-linux-${{ matrix.baffle_arch }}
          path: baffle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch prebuilt helpers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: actions/download-artifact@v4
        with:
          name: mcp-run-helpers-${{ matrix.helper_arch }}-linux
          path: helpers
      - name: Point build.rs at prebuilt helpers
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          echo "CLADDING_MCP_RUN_BIN=$GITHUB_WORKSPACE/helpers/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$GITHUB_WORKSPACE/helpers/run-remote" >> "$GITHUB_ENV"
      - name: Point build.rs at the validated Linux Baffle binary
        run: echo "CLADDING_BAFFLE_BIN=$GITHUB_WORKSPACE/baffle/baffle" >> "$GITHUB_ENV"
      # --locked is safe: the cargo-workspace plugin keeps the root Cargo.lock
      # in sync with the version bump on the release commit.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cladding
      - name: Package
        shell: bash
        run: |
          bin=cladding
          staging="${bin}-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}"
          mkdir "$staging"
          mkdir -p "$staging/docs/features/baffle-integration"
          cp "target/${{ matrix.target }}/release/${bin}" "$staging/"
          cp README.md "$staging/"
          cp docs/features/baffle-integration/embedded-baffle.md "$staging/docs/features/baffle-integration/"
          cp baffle/THIRD_PARTY_NOTICES.md "$staging/"
          cp -R baffle/licenses "$staging/"
          if [ -f baffle/Cargo.lock ]; then cp baffle/Cargo.lock "$staging/baffle-Cargo.lock"; fi
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$ASSET" --clobber

  publish-release:
    needs: [release-please, upload-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
