          mkdir -p "$RUNNER_TEMP/cladding-baffle-tools-aarch64/bin"
          cp "$RUNNER_TEMP/baffle/baffle" "$RUNNER_TEMP/cladding-baffle-tools-aarch64/bin/baffle"
          cp "target/mcp-run/aarch64-unknown-linux-gnu/release/mcp-run" "$RUNNER_TEMP/cladding-baffle-tools-aarch64/bin/mcp-run"
          cp "target/mcp-run/aarch64-unknown-linux-gnu/release/run-remote" "$RUNNER_TEMP/cladding-baffle-tools-aarch64/bin/run-remote"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$RUNNER_TEMP/cladding-baffle-tools-aarch64/bin/baffle-socket-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-baffle-linux-tools-aarch64
          path: ${{ runner.temp }}/cladding-baffle-tools-aarch64
          if-no-files-found: error

  baffle-podman-machine:
    runs-on: macos-15-intel
    needs: baffle-podman-machine-assets-x86_64
    env:
      PODMAN_VERSION: 5.8.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cladding-baffle-linux-tools-x86_64
          path: ${{ runner.temp }}/linux-tools
      # Artifact downloads do not retain executable file modes.
      - name: Restore and verify downloaded Linux tools
        run: |
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote baffle-socket-probe; do
            tool="$tool_dir/$name"
            if [ ! -f "$tool" ]; then
              echo "Downloaded Linux tool is missing: $tool" >&2
              exit 1
            fi
            chmod 0755 "$tool"
            if [ ! -x "$tool" ]; then
              echo "Downloaded Linux tool is not executable: $tool" >&2
              exit 1
            fi
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux amd64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: dtolnay/rust-toolchain@1.96
      - name: Set prebuilt Linux binary paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
          echo "BAFFLE_SOCKET_PROBE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle-socket-probe" >> "$GITHUB_ENV"
          echo "BAFFLE_VALIDATION_CHECK_HOST_UID=false" >> "$GITHUB_ENV"
          echo "BAFFLE_VALIDATION_TMP_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install pinned Podman for macOS
        run: |
          podman_pkg="$RUNNER_TEMP/podman-installer-macos-amd64.pkg"
          curl --fail --location --retry 3 --output "$podman_pkg" "https://github.com/podman-container-tools/podman/releases/download/v${PODMAN_VERSION}/podman-installer-macos-amd64.pkg"
          echo "2312f91523aeb168709f35d41576ade763c891c3991befe7173aac0edf133af9  $podman_pkg" | shasum -a 256 --check
          sudo installer -pkg "$podman_pkg" -target /
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"
          podman --version
      - name: Initialize Podman machine
        run: |
          set +e
          podman --log-level=debug machine init >"$RUNNER_TEMP/podman-machine-init.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/podman-machine-init.log"
          if [ "$status" -ne 0 ]; then
            tail -n 20 "$RUNNER_TEMP/podman-machine-init.log" | while IFS= read -r line; do
              escaped="${line//%/%25}"
              printf '::error title=podman machine init::%s\n' "$escaped"
            done
            exit "$status"
          fi
      - name: Start Podman machine
        run: |
          set +e
          podman --log-level=debug machine start >"$RUNNER_TEMP/podman-machine-start.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/podman-machine-start.log"
          if [ "$status" -ne 0 ]; then
            diagnostics="$(grep -Ei -B 2 -A 2 'error|failed|invalid|unsupported|vfkit|hypervisor|hv_' "$RUNNER_TEMP/podman-machine-start.log" | tail -n 25 | tr '\n' ' ' || true)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(tail -n 25 "$RUNNER_TEMP/podman-machine-start.log" | tr '\n' ' ')"
            fi
            diagnostics="${diagnostics//%/%25}"
            printf '::error title=Podman machine startup diagnostics::%s\n' "$diagnostics"
            hypervisor="$(sysctl kern.hv_support 2>&1 || true)"
            printf '::error title=Host hypervisor capability::%s\n' "${hypervisor//%/%25}"
            exit "$status"
          fi
      - name: Verify rootless Podman machine
        run: |
          podman info --format '{{.Host.Security.Rootless}}'
          machine_uid="$(podman machine ssh podman-machine-default id -u | tail -n 1)"
          machine_gid="$(podman machine ssh podman-machine-default id -g | tail -n 1)"
          echo "BAFFLE_VALIDATION_CONTAINER_UID=$machine_uid" >> "$GITHUB_ENV"
          echo "BAFFLE_VALIDATION_CONTAINER_GID=$machine_gid" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build Cladding for macOS with Linux embedded binaries
        run: cargo build --locked --bin cladding
      - name: Validate Baffle socket access through macOS Podman machine
        run: scripts/validate_baffle_config.sh "$GITHUB_WORKSPACE/target/debug/cladding" "$RUNNER_TEMP/linux-tools/bin/baffle"
      - name: Validate shared managed mounts through macOS Podman machine
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" CLADDING_MANAGED_MOUNT_TMP_DIR="$GITHUB_WORKSPACE" scripts/validate_managed_mounts.sh default

  # Hosted Apple Silicon runners lack nested virtualization. This verifies the
  # host-to-guest binary selection; run the socket validator on a capable Mac.
  baffle-apple-silicon-build:
    runs-on: macos-15
    needs: baffle-podman-machine-assets-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cladding-baffle-linux-tools-aarch64
          path: ${{ runner.temp }}/linux-tools
      - name: Restore and verify Linux aarch64 tools
        run: |
          test "$(uname -m)" = arm64
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote; do
            tool="$tool_dir/$name"
            test -f "$tool"
            chmod 0755 "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux aarch64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: dtolnay/rust-toolchain@1.96
      - name: Set prebuilt Linux binary paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build Cladding for Apple Silicon with Linux aarch64 binaries
        run: cargo build --locked --bin cladding
      - name: Verify embedded Linux Baffle architecture
        run: cargo test --locked --lib baffle_is_embedded_as_a_linux_binary
