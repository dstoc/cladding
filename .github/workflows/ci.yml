name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Test build script platform and helper target selection
        run: |
          rustc --edition=2024 --test build.rs -o "$RUNNER_TEMP/test-build-platforms"
          "$RUNNER_TEMP/test-build-platforms"

  embedded-linux-tools-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run -p cladding-bridge --bin mcp-run --bin run-remote --bin cladding-bridge --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Download and verify pinned x86_64 Baffle release
        run: |
          set -euo pipefail
          scripts/fetch_baffle.sh x86_64 "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*x86-64*) ;;
            *) echo "Baffle is not the expected Linux x86_64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          test "$("$RUNNER_TEMP/baffle/baffle" --version)" = "baffle 2.2.0"
      - name: Assemble and verify embedded Linux tools
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/embedded-linux-tools-x86_64/bin"
          mkdir -p "$asset_dir"
          cp "$RUNNER_TEMP/baffle/baffle" "$asset_dir/baffle"
          cp "target/mcp-run/release/mcp-run" "$asset_dir/mcp-run"
          cp "target/mcp-run/release/run-remote" "$asset_dir/run-remote"
          cp "target/mcp-run/release/cladding-bridge" "$asset_dir/cladding-bridge"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$asset_dir/baffle-socket-probe"
          for tool in "$asset_dir"/*; do
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-linux-tools-x86_64
          path: ${{ runner.temp }}/embedded-linux-tools-x86_64
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: embedded-linux-tools-x86_64
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: embedded-linux-tools-x86_64
          path: ${{ runner.temp }}/linux-tools
      - name: Restore and verify embedded x86_64 Linux tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote cladding-bridge baffle-socket-probe; do
            tool="$tool_dir/$name"
            if [ ! -f "$tool" ]; then
              echo "Downloaded embedded Linux tool is missing: $tool" >&2
              exit 1
            fi
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Set embedded x86_64 Linux tool paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$RUNNER_TEMP/linux-tools/bin/cladding-bridge" >> "$GITHUB_ENV"
          echo "BAFFLE_SOCKET_PROBE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle-socket-probe" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Verify embedded helpers
        run: |
          test -x "$CLADDING_MCP_RUN_BIN"
          test -x "$CLADDING_RUN_REMOTE_BIN"
          test -x "$CLADDING_BRIDGE_BIN"
          test -x "$CLADDING_BAFFLE_BIN"
      - name: Build Cladding with the embedded Baffle executable
        run: cargo build --locked -p cladding --bin cladding
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test pinned Baffle CI asset selection
        run: python3 scripts/test_ci_baffle_assets.py
      - name: Test
        run: cargo test --locked

  linux-integration:
    runs-on: ubuntu-latest
    needs: embedded-linux-tools-x86_64
    env:
      CLADDING_TEST_RUNSC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: embedded-linux-tools-x86_64
          path: ${{ runner.temp }}/linux-tools
      - name: Restore and verify embedded x86_64 Linux tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote cladding-bridge baffle-socket-probe; do
            tool="$tool_dir/$name"
            if [ ! -f "$tool" ]; then
              echo "Downloaded embedded Linux tool is missing: $tool" >&2
              exit 1
            fi
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Set embedded x86_64 Linux tool paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$RUNNER_TEMP/linux-tools/bin/cladding-bridge" >> "$GITHUB_ENV"
          echo "BAFFLE_SOCKET_PROBE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle-socket-probe" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
      - name: Install rootless Podman dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential podman uidmap slirp4netns fuse-overlayfs ca-certificates curl gnupg git jq openssl socat
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          runner_user="$(id -un)"
          if ! grep -q "^${runner_user}:" /etc/subuid; then
            echo "${runner_user}:100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^${runner_user}:" /etc/subgid; then
            echo "${runner_user}:100000:65536" | sudo tee -a /etc/subgid
          fi
      - name: Build Cladding CLI
        run: cargo build --locked --bin cladding
      - name: Check Baffle validation shell syntax
        run: |
          for script in \
            scripts/fetch_baffle.sh \
            scripts/validate_baffle_config.sh \
            scripts/validate_baffle_control_socket.sh \
            scripts/validate_baffle_runtime.sh \
            scripts/validate_runtime_topology.sh \
            scripts/validate_managed_mounts.sh \
            scripts/validate_cladding_image.sh \
            scripts/podman-build-timer; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/validate_expose.py scripts/validate_inject.py
      - name: Build and verify the default Cladding tools image
        run: scripts/validate_cladding_image.sh
      - name: Validate Baffle startup and socket access under rootless Podman
        run: scripts/validate_baffle_config.sh "$GITHUB_WORKSPACE/target/debug/cladding" "$RUNNER_TEMP/linux-tools/bin/baffle"
      - name: Validate shared runtime topology under rootless Podman
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_runtime_topology.sh default
      - name: Validate Baffle policy and client workloads with the default runtime
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_baffle_runtime.sh default
      - name: Validate Baffle policy and client workloads with runsc
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_baffle_runtime.sh runsc
      - name: Validate shared managed mounts with the default runtime
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_managed_mounts.sh default
      - name: Validate shared managed mounts with runsc
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_managed_mounts.sh runsc

  embedded-linux-tools-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run -p cladding-bridge --bin mcp-run --bin run-remote --bin cladding-bridge --target aarch64-unknown-linux-gnu --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Download and verify pinned aarch64 Baffle release
        run: |
          set -euo pipefail
          scripts/fetch_baffle.sh aarch64 "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*aarch64*) ;;
            *) echo "Baffle is not the expected Linux aarch64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          test "$("$RUNNER_TEMP/baffle/baffle" --version)" = "baffle 2.2.0"
      - name: Assemble and verify embedded Linux tools
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/embedded-linux-tools-aarch64/bin"
          mkdir -p "$asset_dir"
          cp "$RUNNER_TEMP/baffle/baffle" "$asset_dir/baffle"
          cp "target/mcp-run/aarch64-unknown-linux-gnu/release/mcp-run" "$asset_dir/mcp-run"
          cp "target/mcp-run/aarch64-unknown-linux-gnu/release/run-remote" "$asset_dir/run-remote"
          cp "target/mcp-run/aarch64-unknown-linux-gnu/release/cladding-bridge" "$asset_dir/cladding-bridge"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$asset_dir/baffle-socket-probe"
          for tool in "$asset_dir"/*; do
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux aarch64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-linux-tools-aarch64
          path: ${{ runner.temp }}/embedded-linux-tools-aarch64
          if-no-files-found: error

  baffle-podman-machine:
    runs-on: ubuntu-24.04
    needs: embedded-linux-tools-x86_64
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PODMAN_VERSION: 5.8.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: embedded-linux-tools-x86_64
          path: ${{ runner.temp }}/linux-tools
      - name: Restore and verify embedded x86_64 Linux tools
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote cladding-bridge baffle-socket-probe; do
            tool="$tool_dir/$name"
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected an x86_64 Linux executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Set embedded Linux tool paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$RUNNER_TEMP/linux-tools/bin/cladding-bridge" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build Cladding with the embedded x86_64 Linux tools
        run: cargo build --locked --bin cladding
      - name: Install Podman Machine and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            podman \
            socat \
            qemu-system-x86 \
            qemu-utils \
            gvproxy \
            virtiofsd \
            uidmap \
            slirp4netns \
            fuse-overlayfs
          qemu-system-x86_64 --version
      - name: Install pinned upstream Podman remote client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/podman-${PODMAN_VERSION}"
          mkdir -p "$release_dir"
          gh release download "v${PODMAN_VERSION}" \
            --repo podman-container-tools/podman \
            --pattern podman-remote-static-linux_amd64.tar.gz \
            --dir "$release_dir"
          archive="$release_dir/podman-remote-static-linux_amd64.tar.gz"
          tar -tzf "$archive" | grep -Fx bin/podman-remote-static-linux_amd64
          tar -xzf "$archive" -C "$release_dir"
          sudo install -m 0755 \
            "$release_dir/bin/podman-remote-static-linux_amd64" \
            /usr/local/bin/podman
          test "$(command -v podman)" = /usr/local/bin/podman
          test "$(podman --version)" = "podman version ${PODMAN_VERSION}"
          podman --version
      - name: Configure Podman Machine helpers and KVM
        run: |
          set -euo pipefail
          helper_dir=/usr/local/libexec/podman
          sudo install -d "$helper_dir"
          sudo ln -sf /usr/bin/gvproxy "$helper_dir/gvproxy"
          sudo ln -sf /usr/libexec/virtiofsd "$helper_dir/virtiofsd"
          test -x "$helper_dir/gvproxy"
          test -x "$helper_dir/virtiofsd"
          echo "gvproxy: $(readlink -f "$helper_dir/gvproxy")"
          echo "virtiofsd: $(readlink -f "$helper_dir/virtiofsd")"
          sudo chmod 666 /dev/kvm
          stat --format='KVM permissions: %a %n' /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Start rootless Podman Machine and validate Cladding topology
        shell: bash
        run: |
          set -euo pipefail
          machine_name=podman-machine-default
          podman_cli=/usr/local/bin/podman
          host_probe_root="$GITHUB_WORKSPACE/cladding-machine-bind-repro-${GITHUB_RUN_ID}"
          host_probe_workspace="$host_probe_root/workspace"
          vm_probe_root="/tmp/cladding-machine-bind-repro-${GITHUB_RUN_ID}"
          vm_probe_workspace="$vm_probe_root/workspace"
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            "$podman_cli" machine ssh "$machine_name" rm -rf "$vm_probe_root" >/dev/null 2>&1 || true
            "$podman_cli" machine stop "$machine_name" >/dev/null 2>&1 || true
            "$podman_cli" machine rm --force "$machine_name" >/dev/null 2>&1 || true
            rmdir "$host_probe_workspace" "$host_probe_root" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          "$podman_cli" machine init --cpus 2 --memory 4096 --rootful=false "$machine_name"
          "$podman_cli" machine start "$machine_name"
          rootless=$("$podman_cli" --connection "$machine_name" info --format '{{.Host.Security.Rootless}}')
          test "$rootless" = true
          machine_uid=$("$podman_cli" machine ssh "$machine_name" id -u)
          test "$machine_uid" -gt 0
          printf 'Podman Machine rootless=%s uid=%s\n' "$rootless" "$machine_uid"

          podman_wrapper_dir="$RUNNER_TEMP/podman-machine-wrapper"
          mkdir -p "$podman_wrapper_dir"
          cat > "$podman_wrapper_dir/podman" <<'EOF'
          #!/bin/sh
          exec /usr/local/bin/podman --connection "${PODMAN_MACHINE_CONNECTION:?}" "$@"
          EOF
          chmod 0755 "$podman_wrapper_dir/podman"
          export PODMAN_MACHINE_CONNECTION="$machine_name"
          export PATH="$podman_wrapper_dir:$PATH"
          test "$(command -v podman)" = "$podman_wrapper_dir/podman"
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

          podman_machine_ssh="$RUNNER_TEMP/podman-machine-ssh"
          cat > "$podman_machine_ssh" <<'EOF'
          #!/bin/sh
          exec /usr/local/bin/podman machine ssh "$PODMAN_MACHINE_CONNECTION" "$@"
          EOF
          chmod 0755 "$podman_machine_ssh"
          mkdir -p "$host_probe_workspace"
          "$podman_machine_ssh" mkdir -p "$vm_probe_workspace"
          host_uid=$(id -u)
          host_gid=$(id -g)
          podman build --tag localhost/cladding-runtime-topology:latest \
            --build-arg "UID=$host_uid" \
            --build-arg "GID=$host_gid" \
            --file scripts/runtime-topology-image/Containerfile \
            scripts/runtime-topology-image
          sh scripts/validate_podman_machine_binds.sh \
            localhost/cladding-runtime-topology:latest \
            "$host_probe_workspace" \
            "$vm_probe_workspace" \
            "$GITHUB_WORKSPACE" \
            "$podman_machine_ssh"

          CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" \
            CLADDING_TOPOLOGY_TMP_DIR="$GITHUB_WORKSPACE" \
            scripts/validate_runtime_topology.sh default

  # Keep the native Apple Silicon build check independent of Machine coverage.
  baffle-apple-silicon-build:
    runs-on: macos-15
    needs: embedded-linux-tools-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: embedded-linux-tools-aarch64
          path: ${{ runner.temp }}/linux-tools
      - name: Restore and verify Linux aarch64 tools
        run: |
          test "$(uname -m)" = arm64
          tool_dir="$RUNNER_TEMP/linux-tools/bin"
          for name in baffle mcp-run run-remote cladding-bridge baffle-socket-probe; do
            tool="$tool_dir/$name"
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux aarch64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: dtolnay/rust-toolchain@1.96
      - name: Set prebuilt Linux binary paths
        run: |
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/linux-tools/bin/baffle" >> "$GITHUB_ENV"
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-tools/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-tools/bin/run-remote" >> "$GITHUB_ENV"
          echo "CLADDING_BRIDGE_BIN=$RUNNER_TEMP/linux-tools/bin/cladding-bridge" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build Cladding for Apple Silicon with Linux aarch64 binaries
        run: cargo build --locked --bin cladding
      - name: Verify embedded Linux helper architectures
        run: cargo test --locked --lib embedded_as_a_linux_binary
