          cp "$RUNNER_TEMP/baffle/baffle" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/baffle"
          cp "$RUNNER_TEMP/linux-helpers/bin/mcp-run" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/mcp-run"
          cp "$RUNNER_TEMP/linux-helpers/bin/run-remote" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/run-remote"
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-baffle-linux-tools-x86_64
