name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  linux-helper-assets-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Verify and stage x86_64 Linux helpers
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/cladding-linux-helpers-x86_64/bin"
          mkdir -p "$asset_dir"
          cp target/mcp-run/release/mcp-run "$asset_dir/mcp-run"
          cp target/mcp-run/release/run-remote "$asset_dir/run-remote"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$asset_dir/baffle-socket-probe"
          for tool in "$asset_dir"/*; do
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-linux-helpers-x86_64
          path: ${{ runner.temp }}/cladding-linux-helpers-x86_64
          if-no-files-found: error

  linux-helper-assets-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target aarch64-unknown-linux-gnu --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Verify and stage aarch64 Linux helpers
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/cladding-linux-helpers-aarch64/bin"
          mkdir -p "$asset_dir"
          cp target/mcp-run/aarch64-unknown-linux-gnu/release/mcp-run "$asset_dir/mcp-run"
          cp target/mcp-run/aarch64-unknown-linux-gnu/release/run-remote "$asset_dir/run-remote"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$asset_dir/baffle-socket-probe"
          for tool in "$asset_dir"/*; do
            test -f "$tool"
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux aarch64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-linux-helpers-aarch64
          path: ${{ runner.temp }}/cladding-linux-helpers-aarch64
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: linux-helper-assets-x86_64
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-x86_64
          path: ${{ runner.temp }}/linux-helpers
      - name: Restore and verify downloaded x86_64 Linux helpers
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/linux-helpers/bin"
          for name in mcp-run run-remote baffle-socket-probe; do
            tool="$tool_dir/$name"
            if [ ! -f "$tool" ]; then
              echo "Downloaded Linux helper is missing: $tool" >&2
              exit 1
            fi
            chmod 0755 "$tool"
            test -x "$tool"
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Set prebuilt x86_64 helper paths
        run: |
          echo "CLADDING_MCP_RUN_BIN=$RUNNER_TEMP/linux-helpers/bin/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$RUNNER_TEMP/linux-helpers/bin/run-remote" >> "$GITHUB_ENV"
      - name: Download and verify pinned x86_64 Baffle release
        env:
          BAFFLE_ARCHIVE: baffle-proxy-v1.1.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          release_url="https://github.com/dstoc/baffle/releases/download/v1.1.0"
          archive_path="$RUNNER_TEMP/$BAFFLE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/baffle"
          curl --fail --location --retry 3 --output "$archive_path" "$release_url/$BAFFLE_ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SHA256SUMS" "$release_url/SHA256SUMS"
          expected=$(awk -v archive="$BAFFLE_ARCHIVE" '$2 == archive || $2 == "*" archive { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          if [ "${#expected}" -ne 64 ]; then
            echo "Expected one SHA256SUMS entry for $BAFFLE_ARCHIVE" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$archive_path" | awk '{ print $1 }')
          else
            echo "No SHA-256 utility is available" >&2
            exit 1
          fi
          test "$actual" = "$expected"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*x86-64*) ;;
            *) echo "Baffle is not the expected Linux x86_64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Verify embedded helpers
        run: |
          test -x "$CLADDING_MCP_RUN_BIN"
          test -x "$CLADDING_RUN_REMOTE_BIN"
          test -x "$CLADDING_BAFFLE_BIN"
      - name: Build Cladding with the embedded Baffle executable
        run: cargo build --locked -p cladding --bin cladding
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Baffle redistribution notices
        run: python3 scripts/test_collect_baffle_notices.py
      - name: Test pinned Baffle CI asset selection
        run: python3 scripts/test_ci_baffle_assets.py
      - name: Test
        run: cargo test --locked

  baffle-config:
    runs-on: ubuntu-latest
    needs: linux-helper-assets-x86_64
    env:
      CLADDING_TEST_RUNSC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cladding-linux-helpers-x86_64
          path: ${{ runner.temp }}/linux-helpers
      - name: Restore and verify downloaded x86_64 Linux helpers
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/linux-helpers/bin"
          for name in mcp-run run-remote baffle-socket-probe; do
            tool="$tool_dir/$name"
            if [ ! -f "$tool" ]; then
              echo "Downloaded Linux helper is missing: $tool" >&2
