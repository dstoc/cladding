name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    env:
      CLADDING_MCP_RUN_BIN: ${{ github.workspace }}/target/mcp-run/release/mcp-run
      CLADDING_RUN_REMOTE_BIN: ${{ github.workspace }}/target/mcp-run/release/run-remote
      CLADDING_BAFFLE_BIN: ${{ runner.temp }}/baffle-install/bin/baffle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - name: Install Baffle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Start a fresh cache and keep workspace artifacts for the helper build.
          prefix-key: v1-rust
          # Refresh cached helper artifacts when helper sources or CI build settings change.
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'crates/mcp-run/src/**', 'crates/mcp-run/Cargo.toml', '.github/workflows/ci.yml') }}
          cache-workspace-crates: true
      - name: Install pinned Baffle
        run: cargo install --locked --force --version '=0.2.0' --root "$RUNNER_TEMP/baffle-install" --bin baffle baffle-proxy
      - name: Build embedded helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target-dir target/mcp-run
      - name: Verify embedded helpers
        run: |
          test -x "$CLADDING_MCP_RUN_BIN"
          test -x "$CLADDING_RUN_REMOTE_BIN"
          test -x "$CLADDING_BAFFLE_BIN"
      - name: Build Cladding with the embedded Baffle executable
        run: cargo build --locked -p cladding --bin cladding
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Extract Baffle and run it in the proxy image
        run: |
          project="$RUNNER_TEMP/embedded-baffle-smoke"
          cladding_bin="$GITHUB_WORKSPACE/target/debug/cladding"
          mkdir -p "$project"
          "$cladding_bin" init --cladding-dir "$project/.cladding" baffleci
          jq '.agent.image = "docker.io/library/debian:bookworm-slim" | .nw_sandbox.image = "docker.io/library/debian:bookworm-slim"' \
            "$project/.cladding/cladding.json" > "$project/cladding.json.tmp"
          mv "$project/cladding.json.tmp" "$project/.cladding/cladding.json"
          "$cladding_bin" --cladding-dir "$project/.cladding" build
          test -x "$project/.cladding/tools/bin/baffle"
          docker run --rm \
            -v "$project/.cladding/tools/bin/baffle:/usr/local/bin/baffle:ro" \
            --entrypoint /usr/local/bin/baffle \
            docker.io/ubuntu/squid:latest --help
