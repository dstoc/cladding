name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CLADDING_MCP_RUN_BIN: ${{ github.workspace }}/target/mcp-run/release/mcp-run
      CLADDING_RUN_REMOTE_BIN: ${{ github.workspace }}/target/mcp-run/release/run-remote
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned x86_64 Baffle release
        env:
          BAFFLE_ARCHIVE: baffle-proxy-v1.1.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          release_url="https://github.com/dstoc/baffle/releases/download/v1.1.0"
          archive_path="$RUNNER_TEMP/$BAFFLE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/baffle"
          curl --fail --location --retry 3 --output "$archive_path" "$release_url/$BAFFLE_ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SHA256SUMS" "$release_url/SHA256SUMS"
          expected=$(awk -v archive="$BAFFLE_ARCHIVE" '$2 == archive || $2 == "*" archive { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          if [ "${#expected}" -ne 64 ]; then
            echo "Expected one SHA256SUMS entry for $BAFFLE_ARCHIVE" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$archive_path" | awk '{ print $1 }')
          else
            echo "No SHA-256 utility is available" >&2
            exit 1
          fi
          test "$actual" = "$expected"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*x86-64*) ;;
            *) echo "Baffle is not the expected Linux x86_64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Build embedded helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target-dir target/mcp-run
      - name: Verify embedded helpers
        run: |
          test -x "$CLADDING_MCP_RUN_BIN"
          test -x "$CLADDING_RUN_REMOTE_BIN"
          test -x "$CLADDING_BAFFLE_BIN"
      - name: Build Cladding with the embedded Baffle executable
        run: cargo build --locked -p cladding --bin cladding
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Baffle redistribution notices
        run: python3 scripts/test_collect_baffle_notices.py
      - name: Test pinned Baffle CI asset selection
        run: python3 scripts/test_ci_baffle_assets.py
      - name: Test
        run: cargo test --locked

  baffle-config:
    runs-on: ubuntu-latest
    env:
      CLADDING_TEST_RUNSC: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned x86_64 Baffle release
        env:
          BAFFLE_ARCHIVE: baffle-proxy-v1.1.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          release_url="https://github.com/dstoc/baffle/releases/download/v1.1.0"
          archive_path="$RUNNER_TEMP/$BAFFLE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/baffle"
          curl --fail --location --retry 3 --output "$archive_path" "$release_url/$BAFFLE_ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SHA256SUMS" "$release_url/SHA256SUMS"
          expected=$(awk -v archive="$BAFFLE_ARCHIVE" '$2 == archive || $2 == "*" archive { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          if [ "${#expected}" -ne 64 ]; then
            echo "Expected one SHA256SUMS entry for $BAFFLE_ARCHIVE" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$archive_path" | awk '{ print $1 }')
          else
            echo "No SHA-256 utility is available" >&2
            exit 1
          fi
          test "$actual" = "$expected"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*x86-64*) ;;
            *) echo "Baffle is not the expected Linux x86_64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
      - name: Install rootless Podman dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential podman uidmap slirp4netns fuse-overlayfs ca-certificates curl gnupg git jq openssl
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          runner_user="$(id -un)"
          if ! grep -q "^${runner_user}:" /etc/subuid; then
            echo "${runner_user}:100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^${runner_user}:" /etc/subgid; then
            echo "${runner_user}:100000:65536" | sudo tee -a /etc/subgid
          fi
      - name: Build Baffle socket operation probe
        run: |
          cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
          echo "BAFFLE_SOCKET_PROBE_BIN=$RUNNER_TEMP/baffle-socket-probe" >> "$GITHUB_ENV"
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target-dir target/mcp-run
      - name: Set execution helper paths
        run: |
          echo "CLADDING_MCP_RUN_BIN=$GITHUB_WORKSPACE/target/mcp-run/release/mcp-run" >> "$GITHUB_ENV"
          echo "CLADDING_RUN_REMOTE_BIN=$GITHUB_WORKSPACE/target/mcp-run/release/run-remote" >> "$GITHUB_ENV"
      - name: Build Cladding CLI
        run: cargo build --locked --bin cladding
      - name: Check Baffle validation shell syntax
        run: |
          for script in scripts/validate_baffle_config.sh scripts/validate_baffle_control_socket.sh scripts/validate_baffle_runtime.sh scripts/validate_managed_mounts.sh; do
            sh -n "$script"
          done
      - name: Validate Baffle startup and socket access under rootless Podman
        run: scripts/validate_baffle_config.sh "$GITHUB_WORKSPACE/target/debug/cladding" "$RUNNER_TEMP/baffle/baffle"
      - name: Validate Baffle policy and client workloads with the default runtime
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_baffle_runtime.sh default
      - name: Validate Baffle policy and client workloads with runsc
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_baffle_runtime.sh runsc
      - name: Validate shared managed mounts with the default runtime
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_managed_mounts.sh default
      - name: Validate shared managed mounts with runsc
        run: CLADDING_BIN="$GITHUB_WORKSPACE/target/debug/cladding" scripts/validate_managed_mounts.sh runsc

  baffle-podman-machine-assets-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned x86_64 Baffle release
