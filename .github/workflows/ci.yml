          BAFFLE_ARCHIVE: baffle-proxy-v1.1.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          release_url="https://github.com/dstoc/baffle/releases/download/v1.1.0"
          archive_path="$RUNNER_TEMP/$BAFFLE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/baffle"
          curl --fail --location --retry 3 --output "$archive_path" "$release_url/$BAFFLE_ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SHA256SUMS" "$release_url/SHA256SUMS"
          expected=$(awk -v archive="$BAFFLE_ARCHIVE" '$2 == archive || $2 == "*" archive { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          if [ "${#expected}" -ne 64 ]; then
            echo "Expected one SHA256SUMS entry for $BAFFLE_ARCHIVE" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$archive_path" | awk '{ print $1 }')
          else
            echo "No SHA-256 utility is available" >&2
            exit 1
          fi
          test "$actual" = "$expected"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*x86-64*) ;;
            *) echo "Baffle is not the expected Linux x86_64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target x86_64-unknown-linux-gnu --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Verify embedded helper inputs
        run: |
          test -x "$CLADDING_BAFFLE_BIN"
          test -x "target/mcp-run/x86_64-unknown-linux-gnu/release/mcp-run"
          test -x "target/mcp-run/x86_64-unknown-linux-gnu/release/run-remote"
          test -x "$RUNNER_TEMP/baffle-socket-probe"
          for tool in \
            "$CLADDING_BAFFLE_BIN" \
            "target/mcp-run/x86_64-unknown-linux-gnu/release/mcp-run" \
            "target/mcp-run/x86_64-unknown-linux-gnu/release/run-remote" \
            "$RUNNER_TEMP/baffle-socket-probe"; do
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*x86-64*) ;;
              *) echo "Expected a Linux x86_64 executable: $tool" >&2; exit 1 ;;
            esac
          done
      - name: Stage Linux assets for Podman machine validation
        run: |
          mkdir -p "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin"
          cp "$RUNNER_TEMP/baffle/baffle" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/baffle"
          cp "target/mcp-run/x86_64-unknown-linux-gnu/release/mcp-run" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/mcp-run"
          cp "target/mcp-run/x86_64-unknown-linux-gnu/release/run-remote" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/run-remote"
          cp "$RUNNER_TEMP/baffle-socket-probe" "$RUNNER_TEMP/cladding-baffle-tools-x86_64/bin/baffle-socket-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: cladding-baffle-linux-tools-x86_64
          path: ${{ runner.temp }}/cladding-baffle-tools-x86_64
          if-no-files-found: error

  baffle-podman-machine-assets-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned aarch64 Baffle release
        env:
          BAFFLE_ARCHIVE: baffle-proxy-v1.1.0-aarch64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          release_url="https://github.com/dstoc/baffle/releases/download/v1.1.0"
          archive_path="$RUNNER_TEMP/$BAFFLE_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/baffle"
          curl --fail --location --retry 3 --output "$archive_path" "$release_url/$BAFFLE_ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/SHA256SUMS" "$release_url/SHA256SUMS"
          expected=$(awk -v archive="$BAFFLE_ARCHIVE" '$2 == archive || $2 == "*" archive { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          if [ "${#expected}" -ne 64 ]; then
            echo "Expected one SHA256SUMS entry for $BAFFLE_ARCHIVE" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$archive_path" | awk '{ print $1 }')
          else
            echo "No SHA-256 utility is available" >&2
            exit 1
          fi
          test "$actual" = "$expected"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/baffle"
          chmod 0755 "$RUNNER_TEMP/baffle/baffle"
          description=$(file -b "$RUNNER_TEMP/baffle/baffle")
          printf '%s\n' "$description"
          case "$description" in
            "ELF 64-bit"*aarch64*) ;;
            *) echo "Baffle is not the expected Linux aarch64 executable" >&2; exit 1 ;;
          esac
          test -x "$RUNNER_TEMP/baffle/baffle"
          echo "CLADDING_BAFFLE_BIN=$RUNNER_TEMP/baffle/baffle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build Linux execution helpers
        run: cargo build --locked --release -p mcp-run --bin mcp-run --bin run-remote --target aarch64-unknown-linux-gnu --target-dir target/mcp-run
      - name: Build Linux Baffle socket operation probe
        run: cc -std=c11 -Wall -Wextra -Werror scripts/baffle_socket_probe.c -o "$RUNNER_TEMP/baffle-socket-probe"
      - name: Verify embedded helper inputs
        run: |
          test -x "$CLADDING_BAFFLE_BIN"
          test -x "target/mcp-run/aarch64-unknown-linux-gnu/release/mcp-run"
          test -x "target/mcp-run/aarch64-unknown-linux-gnu/release/run-remote"
          test -x "$RUNNER_TEMP/baffle-socket-probe"
          for tool in \
            "$CLADDING_BAFFLE_BIN" \
            "target/mcp-run/aarch64-unknown-linux-gnu/release/mcp-run" \
            "target/mcp-run/aarch64-unknown-linux-gnu/release/run-remote" \
            "$RUNNER_TEMP/baffle-socket-probe"; do
            description=$(file -b "$tool")
            printf '%s: %s\n' "$tool" "$description"
            case "$description" in
              "ELF 64-bit"*aarch64*) ;;
              *) echo "Expected a Linux aarch64 executable: $tool" >&2; exit 1 ;;
            esac
          done
