http_port 127.0.0.1:3128 name=agent ssl-bump cert=/run/squid-private/ca.crt key=/run/squid-private/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
http_port 127.0.0.1:3129 name=nw_sandbox
visible_hostname REPLACE_PROXY_NAME

# The startup script selects the DNS server from the proxy container's
# /etc/resolv.conf, as the existing proxy startup does.
dns_nameservers REPLACE_DNS_IP

acl from_agent myportname agent
acl from_nw_sandbox myportname nw_sandbox
acl agent_domains dstdomain "/opt/config/agent/domains.lst"
acl agent_host dstdomain host.containers.internal
acl agent_host_ports port "/opt/config/agent/host_ports.lst"
acl nw_sandbox_domains dstdomain "REPLACE_NW_SANDBOX_DOMAINS_FILE"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Exact names only. Entries must not start with a dot or wildcard.
acl intercept_connect_hosts dstdomain -n "/run/squid-private/domains.lst"
acl intercept_client_sni ssl::server_name --client-requested "/run/squid-private/domains.lst"
acl bump_step1 at_step SslBump1

# Peek once, then bump only when the CONNECT authority and client SNI both
# match an exact private interception name on the agent listener.
ssl_bump peek bump_step1
ssl_bump bump from_agent intercept_connect_hosts intercept_client_sni
ssl_bump splice all

sslcrtd_program /usr/local/libexec/security_file_certgen -s /run/squid/ssl_db -M 4MB
sslcrtd_children 5
tls_outgoing_options default-ca=on
cache_effective_user proxy

http_access allow from_agent agent_host agent_host_ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow from_agent agent_domains Safe_ports
http_access allow from_nw_sandbox nw_sandbox_domains Safe_ports
http_access deny all

cache deny all
cache_log stdio:/dev/stderr
access_log stdio:/dev/stdout
pid_filename /tmp/squid.pid
coredump_dir /tmp

# Filename prefixes are stable for readable diagnostics. The two private
# rule files are independent, so evaluation order does not change behavior.
include /run/squid-private/rules/*.conf
